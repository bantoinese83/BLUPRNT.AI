# Fresh account each run (timestamp email). Project name must match assertions in parent flows.
appId: ai.bluprnt.mobile
---
- runFlow:
    file: onboarding-skip.yaml
- tapOn: "Get Started"
- tapOn: "Kitchen"
- tapOn: { id: "onboarding-continue" }
- tapOn: "ZIP code"
- inputText: "90210"
- tapOn: "Add your project location"
- tapOn: { id: "onboarding-continue" }
- tapOn: { text: "Just planning.*" }
- tapOn: { id: "onboarding-continue" }
- tapOn: "Or describe the project here…"
- inputText: "E2E Tab Journey Project"
- tapOn: "Add any photos and details"
- tapOn: { id: "onboarding-continue" }
- extendedWaitUntil:
    visible: "Everything we see"
    timeout: 90000
- tapOn: { id: "onboarding-continue" }
- inputText: ${'e2e.tabs.' + Date.now() + '@bluprnt.ai'}
- tapOn: "Password"
- inputText: "MaestroPassword123!"
- tapOn: "Create account"
- extendedWaitUntil:
    visible: "Dashboard"
    timeout: 30000
- assertVisible: "E2E Tab Journey Project"
