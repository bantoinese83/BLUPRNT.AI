appId: ai.bluprnt.mobile
---
- runFlow:
    file: common/launch-app.active.yaml
- extendedWaitUntil:
    visible: "Snap it. Get the number."
    timeout: 30000
- tapOn: "Next"
- tapOn: "Next"
- tapOn: "Next"
- tapOn: "Get Started"

# Step 0: Project Type
- assertVisible: "What are you planning today?"
- tapOn: "Kitchen"
- tapOn:
    id: "onboarding-continue"

# Step 1: Location
- assertVisible: "Add your project location"
- tapOn: "ZIP code"
- inputText: "90210"
- tapOn: "Add your project location" # Dismiss keyboard
- tapOn:
    id: "onboarding-continue"
- extendedWaitUntil:
    visible: "Where are you in the process?"
    timeout: 10000

# Step 2: Stage
- tapOn:
    text: "Just planning.*"
- tapOn:
    id: "onboarding-continue"
- extendedWaitUntil:
    visible: "Add any photos and details"
    timeout: 10000

# Step 3: Vision/Context
- tapOn: "Or describe the project here…"
- inputText: "Full remodel with quartz countertops and custom cabinets"
- tapOn: "Add any photos and details" # Dismiss keyboard
- tapOn: "Start build my bluprnt"
- extendedWaitUntil:
    visible: "Building your BLUPRNT"
    timeout: 30000
- extendedWaitUntil:
    visible: "Everything we see" 
    timeout: 60000

# Step 5: Preview
- assertVisible: "Investment Range"
- assertVisible: "View Breakdown"
- tapOn:
    id: "onboarding-continue"

# Step 6: Final
- assertVisible: "Save this project"
- tapOn: "Already have an account? Sign In"
- assertVisible: "Enter your email"
