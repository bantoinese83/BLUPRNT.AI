appId: ai.bluprnt.mobile
---
- runFlow:
    file: common/launch-app.active.yaml
- runFlow:
    file: common/signup-fixed-account-dashboard.yaml

# Step 2: Management - Rename
- tapOn: { id: "rename-project-trigger" }
- tapOn: { id: "rename-project-input" }
- eraseText: 50
- inputText: "Renamed Maestro Project"
- tapOn: "Save"
- extendedWaitUntil:
    visible: "Renamed Maestro Project"
    timeout: 10000

# Step 3: Management - Delete
- longPressOn: { id: "project-card-Renamed Maestro Project" }
- assertVisible: "Delete Project"
- tapOn: "Delete"
- extendedWaitUntil:
    visible: "Deleted" # Success alert
    timeout: 5000
- tapOn: "OK"

# Verify redirection to empty state
- extendedWaitUntil:
    visible: "Your home hub is ready"
    timeout: 10000
