# Run from repo root: npm run test:e2e:mobile mobile/maestro/app-smoke.yaml
# Requires: Maestro CLI, iOS Simulator or Android emulator, dev build installed (ai.bluprnt.mobile).
#
# Web smoke (fast, no device): npm run test:e2e:smoke
# Deeper web: npm run test:e2e
# Deeper mobile: mobile/maestro/full-journey.yaml
appId: ai.bluprnt.mobile
---
# Launch template chosen by scripts/e2e-mobile-maestro.sh (see common/launch-app-*.yaml).
- runFlow:
    file: common/launch-app.active.yaml
- waitForAnimationToEnd:
    timeout: 12000
# Carousel title can lag after a cold start; "Next" is the primary readiness signal.
- extendedWaitUntil:
    visible: "Next"
    timeout: 90000
- assertVisible: "Snap the room. Get the number."
- tapOn: "Next"
- waitForAnimationToEnd:
    timeout: 4000
- tapOn: "Next"
- waitForAnimationToEnd:
    timeout: 4000
- tapOn: "Next"
- waitForAnimationToEnd:
    timeout: 4000
- tapOn: "Get Started"
- waitForAnimationToEnd:
    timeout: 4000
- assertVisible: "What are you working on?"
- scrollUntilVisible:
    element:
      id: "onboarding-privacy-note"
    direction: DOWN
    timeout: 20000
    visibilityPercentage: 40
- assertVisible:
    id: "onboarding-privacy-note"
