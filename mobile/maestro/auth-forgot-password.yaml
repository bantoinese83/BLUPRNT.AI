# UI smoke: forgot-password flow (no session required).
appId: ai.bluprnt.mobile
---
- runFlow:
    file: common/launch-app.active.yaml
- runFlow:
    file: common/onboarding-skip.yaml
    when:
      visible: "Snap it. Get the number."
- tapOn: "Already have an account? Sign In"
- extendedWaitUntil:
    visible: "Sign In"
    timeout: 20000
- tapOn: "Forgot password?"
- extendedWaitUntil:
    visible: "Reset password"
    timeout: 15000
- assertVisible: "We’ll email you a link to choose a new password."
- tapOn: "Email address"
- inputText: "maestro-smoke@example.com"
- tapOn: "Send reset link"
- extendedWaitUntil:
    visible: "Check your email"
    timeout: 30000
