# Optional: dispatch a production build when you're ready to ship mobile.
# Requires EXPO_TOKEN (and linked project) as repository secrets.
name: EAS Build (manual)

on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile deps
        working-directory: mobile
        run: npm ci

      - name: Install EAS CLI
        run: npm i -g eas-cli

      - name: EAS build (preview profile)
        working-directory: mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas build --platform all --non-interactive --no-wait --profile preview
