[functions.revenuecat-webhook]
enabled = true
# External webhook (RevenueCat servers) — no Supabase user JWT on the request
verify_jwt = false
import_map = "./functions/revenuecat-webhook/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/revenuecat-webhook/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/revenuecat-webhook/*.html" ]
