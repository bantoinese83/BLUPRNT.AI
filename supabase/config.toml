# Local Supabase (optional). Deploy functions with:
# npx supabase functions deploy <name> --project-ref YOUR_REF
#
# JWT verification at gateway: off for user functions that validate the bearer in Deno;
# off for webhooks and public/anon endpoints. See README Edge Functions table.

[auth]
enable_signup = true

[auth.email]
enable_confirmations = false

# Gateway JWT verify often returns 401 "Invalid JWT" for valid ES256 session tokens
# (browser + supabase-js). Auth is enforced in-handler via getUserIdFromRequest + RLS patterns.
[functions.photo-to-scope]
verify_jwt = false

[functions.upload-document]
verify_jwt = true
import_map = "./functions/import_map.json"

[functions.process-document-queue]
verify_jwt = false
import_map = "./functions/import_map.json"


[functions.get-ledger-entry]
verify_jwt = false
import_map = "./functions/import_map.json"

[functions.get-document-signed-url]
verify_jwt = false
import_map = "./functions/import_map.json"

[functions.generate-data-export]
verify_jwt = true
import_map = "./functions/import_map.json"

[functions.stripe-webhook]
verify_jwt = false

[functions.create-checkout]
verify_jwt = false

[functions.get-project-view]
verify_jwt = false

[functions.delete-account]
verify_jwt = false
import_map = "./functions/import_map.json"

[functions.send-email]
verify_jwt = false
import_map = "./functions/import_map.json"

[functions.revenuecat-webhook]
enabled = true
verify_jwt = false
import_map = "./functions/revenuecat-webhook/deno.json"
entrypoint = "./functions/revenuecat-webhook/index.ts"

[functions.chat-with-project]
verify_jwt = false

[functions.submit-marketing-lead]
verify_jwt = false

[functions.upload-gallery-photo]
enabled = true
verify_jwt = true
import_map = "./functions/upload-gallery-photo/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/upload-gallery-photo/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/upload-gallery-photo/*.html" ]

