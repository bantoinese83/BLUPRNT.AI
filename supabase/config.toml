# Local Supabase (optional). Deploy functions with:
# npx supabase functions deploy <name> --project-ref YOUR_REF
#
# JWT verification: enabled for user-invoked functions; disabled for webhooks,
# public token endpoints, and submit-marketing-lead (anon).

# Multipart + RN/Expo clients: gateway JWT verify often 401s even with a valid session.
# Auth is enforced in-handler when `project_id` is present (assertProjectOwner).
[functions.photo-to-scope]
verify_jwt = false

[functions.upload-invoice]
verify_jwt = true

[functions.get-invoice]
verify_jwt = true

[functions.get-document-signed-url]
verify_jwt = true

[functions.stripe-webhook]
verify_jwt = false

[functions.create-checkout]
verify_jwt = true

[functions.get-project-view]
verify_jwt = false

[functions.delete-account]
verify_jwt = true

[functions.send-email]
verify_jwt = true

[functions.revenuecat-webhook]
enabled = true
verify_jwt = false
import_map = "./functions/revenuecat-webhook/deno.json"
entrypoint = "./functions/revenuecat-webhook/index.ts"

[functions.chat-with-project]
verify_jwt = true

[functions.submit-marketing-lead]
verify_jwt = false
